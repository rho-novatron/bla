<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Schematic Adventure</title>
    <link rel="stylesheet" href="style.css">
    <script src="music.js"></script>
</head>
<body>
    <div class="container">
        <h1>Electronics Schematic Adventure</h1>
        <div class="game-info">
            <p>Use <strong>Arrow Keys</strong> or <strong>A/D</strong> to move, <strong>Space</strong> or <strong>W</strong> to jump</p>
            <p>Navigate through the circuit board and reach the goal!</p>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <button id="restartBtn">Restart Game</button>
            <button id="musicBtn" class="music-btn">🔇 Music Off</button>
            <div class="score">Score: <span id="score">0</span></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
